<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema MIX</title>
  <style>
    :root {
      --bg: #06070d;
      --bg-soft: #0f1326;
      --surface: #151a37;
      --surface-2: #1c2350;
      --text: #f5f7ff;
      --muted: #a7afd4;
      --primary: #5f7dff;
      --accent: #9f43ff;
      --danger: #ff4e71;
      --success: #34d399;
      --border: rgba(255, 255, 255, 0.14);
      --radius: 16px;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 550px at -10% -20%, rgba(95, 125, 255, 0.25), transparent 60%),
        radial-gradient(1200px 550px at 110% -20%, rgba(159, 67, 255, 0.24), transparent 60%),
        var(--bg);
    }

    .container { width: min(1200px, 95%); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(8, 10, 20, 0.83);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 0;
    }

    .admin-left { margin-right: auto; }

    .brand {
      margin: 0 auto;
      font-size: 1.38rem;
      font-weight: 900;
      letter-spacing: 0.7px;
      user-select: none;
    }
    .brand span { color: var(--accent); }

    .search { flex: 1 1 240px; max-width: 360px; }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #121838;
      color: var(--text);
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    textarea { min-height: 88px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(95, 125, 255, 0.25);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(130deg, var(--primary), var(--accent));
      transition: transform .2s, filter .2s, opacity .2s;
      box-shadow: var(--shadow);
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .btn:active { transform: translateY(0); }
    .btn.secondary {
      background: #263065;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .btn.danger { background: var(--danger); box-shadow: none; }

    .hero {
      margin-top: 16px;
      border-radius: 20px;
      overflow: hidden;
      min-height: 290px;
      position: relative;
      box-shadow: var(--shadow);
      background: linear-gradient(120deg, #1a214b, #2b1855);
      display: grid;
      align-content: end;
      padding: 28px;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(6, 8, 14, 0.86), rgba(8, 10, 16, 0.2));
      pointer-events: none;
    }

    .hero-content { position: relative; z-index: 1; }
    .hero h1 { margin: 0 0 .6rem; font-size: clamp(1.55rem, 4vw, 2.45rem); }
    .hero p { margin: 0; color: #d8defd; max-width: 760px; }

    .section-title { margin: 28px 0 12px; font-size: 1.2rem; }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .movie-card {
      background: linear-gradient(160deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .28s, border-color .28s;
      animation: fadeIn .35s ease;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      border-color: rgba(159, 67, 255, 0.6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #0d1124;
    }

    .movie-body { padding: 10px; }
    .movie-title { margin: 0 0 8px; font-size: 1rem; min-height: 42px; }

    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 8px;
    }

    .chip {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(95, 125, 255, 0.5);
      background: rgba(95, 125, 255, 0.2);
      font-size: .74rem;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 80;
      background: rgba(3, 5, 10, 0.78);
    }

    .modal.open { display: flex; }

    .panel {
      width: min(980px, 100%);
      max-height: 92vh;
      overflow: auto;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #111838;
      box-shadow: var(--shadow);
      padding: 14px;
      animation: pop .22s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .details-grid { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
    .details-grid img { width: 100%; border-radius: 14px; height: 370px; object-fit: cover; }

    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .9rem; }
    th, td { border-bottom: 1px solid var(--border); text-align: left; padding: 8px; }

    .toasts {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 99;
      display: grid;
      gap: 8px;
    }

    .toast {
      background: #1b2352;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 180px;
    }

    @media (max-width: 820px) {
      .details-grid { grid-template-columns: 1fr; }
      .movie-card img { height: 255px; }
      .brand { order: 2; width: 100%; text-align: center; }
      .search { max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <button id="adminBtn" class="btn secondary admin-left">Admin</button>
      <div class="brand">Cinema <span>MIX</span></div>
      <input id="searchInput" class="search" placeholder="Search movies..." />
      <select id="categoryFilter"></select>
      <select id="yearFilter"></select>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to Cinema MIX</h1>
        <p>Modern cinematic experience inspired by Arabic streaming style, with powerful admin tools and instant movie playback.</p>
      </div>
    </section>

    <h2 class="section-title">All Movies</h2>
    <section id="moviesGrid" class="movies-grid"></section>
  </main>

  <div id="watchModal" class="modal"><div id="watchPanel" class="panel"></div></div>
  <div id="loginModal" class="modal"><div id="loginPanel" class="panel"></div></div>
  <div id="dashboardModal" class="modal"><div id="dashboardPanel" class="panel"></div></div>
  <div id="toasts" class="toasts"></div>

  <script>
    (() => {
      "use strict";

      // LocalStorage keys and admin credentials
      const MOVIES_KEY = "cinema_mix_movies_v3";
      const ADMIN_KEY = "cinema_mix_admin_logged";
      const ADMIN_USER = "admin";
      const ADMIN_PASS = "Amr20201";

      // Initial movie data for first load
      const seedMovies = [
        {
          id: crypto.randomUUID(),
          title: "Dune: Part Two",
          poster: "https://image.tmdb.org/t/p/w780/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
          description: "Paul Atreides joins the Fremen to avenge his family and reclaim Arrakis.",
          category: "Action",
          year: 2024,
          rating: 8.8
        },
        {
          id: crypto.randomUUID(),
          title: "Interstellar",
          poster: "https://image.tmdb.org/t/p/w780/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
          description: "A team travels through a wormhole to secure humanity's future.",
          category: "Sci-Fi",
          year: 2014,
          rating: 8.6
        },
        {
          id: crypto.randomUUID(),
          title: "The Batman",
          poster: "https://image.tmdb.org/t/p/w780/74xTEgt7R36Fpooo50r9T25onhq.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
          description: "Batman investigates corruption in Gotham while hunting the Riddler.",
          category: "Drama",
          year: 2022,
          rating: 7.8
        },
        {
          id: crypto.randomUUID(),
          title: "Free Guy",
          poster: "https://image.tmdb.org/t/p/w780/xmbU4JTUm8rsdtn7Y3Fcm30GpeT.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
          description: "A bank teller discovers he is an NPC and rewrites his own story.",
          category: "Comedy",
          year: 2021,
          rating: 7.1
        }
      ];

      const state = {
        movies: [],
        editMovieId: null,
        isAdmin: localStorage.getItem(ADMIN_KEY) === "1"
      };

      const el = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

      function toast(message, type = "info") {
        const node = document.createElement("div");
        node.className = "toast";
        if (type === "error") node.style.borderColor = "rgba(255,78,113,.95)";
        if (type === "success") node.style.borderColor = "rgba(52,211,153,.95)";
        node.textContent = message;
        el("toasts").appendChild(node);
        setTimeout(() => node.remove(), 2800);
      }

      function saveMovies() {
        localStorage.setItem(MOVIES_KEY, JSON.stringify(state.movies));
      }

      function loadMovies() {
        const raw = JSON.parse(localStorage.getItem(MOVIES_KEY) || "null");
        state.movies = Array.isArray(raw) && raw.length ? raw : seedMovies;
        saveMovies();
      }

      function openModal(id) { el(id).classList.add("open"); }
      function closeModal(id) { el(id).classList.remove("open"); }

      function buildFilters() {
        const categories = [...new Set(state.movies.map((m) => m.category))].sort();
        const years = [...new Set(state.movies.map((m) => m.year))].sort((a, b) => b - a);

        el("categoryFilter").innerHTML = `<option value="all">All Categories</option>${categories.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}`;
        el("yearFilter").innerHTML = `<option value="all">All Years</option>${years.map((y) => `<option value="${y}">${y}</option>`).join("")}`;
      }

      function getFilteredMovies() {
        const q = el("searchInput").value.trim().toLowerCase();
        const category = el("categoryFilter").value;
        const year = el("yearFilter").value;

        return state.movies.filter((m) => {
          const byQuery = m.title.toLowerCase().includes(q);
          const byCategory = category === "all" || m.category === category;
          const byYear = year === "all" || String(m.year) === year;
          return byQuery && byCategory && byYear;
        });
      }

      function cardTemplate(movie) {
        return `
          <article class="movie-card">
            <img loading="lazy" src="${escapeHtml(movie.poster)}" alt="${escapeHtml(movie.title)} poster" onerror="this.src='https://via.placeholder.com/500x750/121212/ffffff?text=No+Image'" />
            <div class="movie-body">
              <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
              <div class="meta"><span>${escapeHtml(movie.category)}</span><span>${movie.year}</span></div>
              <div class="meta"><span>⭐ ${Number(movie.rating).toFixed(1)}</span><span></span></div>
              <span class="chip">${escapeHtml(movie.category)}</span>
              <div class="row">
                <button class="btn" data-action="watch" data-id="${movie.id}">Watch</button>
                <button class="btn secondary" data-action="details" data-id="${movie.id}">Details</button>
              </div>
            </div>
          </article>`;
      }

      function renderMovies() {
        const list = getFilteredMovies();
        el("moviesGrid").innerHTML = list.length ? list.map(cardTemplate).join("") : `<div class="empty">No movies found.</div>`;
      }

      function openWatch(movieId) {
        const movie = state.movies.find((m) => m.id === movieId);
        if (!movie) return;

        el("watchPanel").innerHTML = `
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">${escapeHtml(movie.title)}</h2>
            <button class="btn secondary" data-close="watchModal">Close</button>
          </div>
          <div class="details-grid" style="margin-top:8px">
            <img src="${escapeHtml(movie.poster)}" alt="${escapeHtml(movie.title)}" />
            <div>
              <p style="color:var(--muted)">${escapeHtml(movie.description)}</p>
              <div class="row" style="margin-bottom:10px">
                <span class="chip">${escapeHtml(movie.category)}</span>
                <span>${movie.year}</span>
                <span>⭐ ${Number(movie.rating).toFixed(1)}</span>
              </div>
              <video controls style="width:100%;max-height:380px;background:#000;border-radius:12px">
                <source src="${escapeHtml(movie.video)}" type="video/mp4" />
              </video>
            </div>
          </div>`;

        openModal("watchModal");
      }

      function openLogin() {
        el("loginPanel").innerHTML = `
          <h2 style="margin-top:0">Admin Login</h2>
          <div class="admin-grid">
            <input id="adminUsername" placeholder="Username" autocomplete="username" />
            <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" />
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="loginSubmit">Login</button>
            <button class="btn secondary" data-close="loginModal">Cancel</button>
          </div>`;

        openModal("loginModal");

        el("loginSubmit").onclick = () => {
          const user = el("adminUsername").value.trim();
          const pass = el("adminPassword").value.trim();
          if (user === ADMIN_USER && pass === ADMIN_PASS) {
            state.isAdmin = true;
            localStorage.setItem(ADMIN_KEY, "1");
            closeModal("loginModal");
            openDashboard();
            toast("Login successful", "success");
          } else {
            toast("Invalid username or password", "error");
          }
        };
      }

      function openDashboard() {
        if (!state.isAdmin) {
          openLogin();
          return;
        }

        const editing = state.movies.find((m) => m.id === state.editMovieId);

        el("dashboardPanel").innerHTML = `
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">Admin Dashboard</h2>
            <div class="row">
              <button class="btn danger" id="logoutBtn">Logout</button>
              <button class="btn secondary" data-close="dashboardModal">Close</button>
            </div>
          </div>

          <h3 style="margin:12px 0 8px">Add / Edit Movie</h3>
          <div class="admin-grid">
            <input id="fTitle" placeholder="Title" value="${escapeHtml(editing?.title || "")}" />
            <input id="fPoster" placeholder="Poster URL" value="${escapeHtml(editing?.poster || "")}" />
            <input id="fVideo" placeholder="Video URL" value="${escapeHtml(editing?.video || "")}" />
            <input id="fCategory" placeholder="Category" value="${escapeHtml(editing?.category || "")}" />
            <input id="fYear" type="number" min="1900" max="2100" placeholder="Year" value="${escapeHtml(editing?.year || "")}" />
            <input id="fRating" type="number" min="0" max="10" step="0.1" placeholder="Rating" value="${escapeHtml(editing?.rating || "")}" />
          </div>
          <textarea id="fDescription" placeholder="Description">${escapeHtml(editing?.description || "")}</textarea>
          <div class="row" style="margin-top:8px">
            <button class="btn" id="saveMovieBtn">Save Movie</button>
            <button class="btn secondary" id="clearFormBtn">Clear</button>
          </div>

          <h3 style="margin:14px 0 8px">Manage Movies</h3>
          <table>
            <thead><tr><th>Title</th><th>Category</th><th>Year</th><th>Rating</th><th>Actions</th></tr></thead>
            <tbody>
              ${state.movies.map((m) => `
                <tr>
                  <td>${escapeHtml(m.title)}</td>
                  <td>${escapeHtml(m.category)}</td>
                  <td>${m.year}</td>
                  <td>${Number(m.rating).toFixed(1)}</td>
                  <td>
                    <button class="btn secondary" data-admin="edit" data-id="${m.id}">Edit</button>
                    <button class="btn danger" data-admin="delete" data-id="${m.id}">Delete</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;

        openModal("dashboardModal");

        el("logoutBtn").onclick = () => {
          state.isAdmin = false;
          state.editMovieId = null;
          localStorage.removeItem(ADMIN_KEY);
          closeModal("dashboardModal");
          toast("Logged out", "success");
        };

        el("saveMovieBtn").onclick = () => {
          const data = {
            id: state.editMovieId || crypto.randomUUID(),
            title: el("fTitle").value.trim(),
            poster: el("fPoster").value.trim(),
            video: el("fVideo").value.trim(),
            description: el("fDescription").value.trim(),
            category: el("fCategory").value.trim(),
            year: Number(el("fYear").value),
            rating: Number(el("fRating").value)
          };

          // Validate required fields before saving
          if (!data.title || !data.poster || !data.video || !data.description || !data.category || !data.year || Number.isNaN(data.rating)) {
            toast("Please complete all fields correctly", "error");
            return;
          }

          const idx = state.movies.findIndex((m) => m.id === data.id);
          if (idx >= 0) state.movies[idx] = data;
          else state.movies.unshift(data);

          state.editMovieId = null;
          saveMovies();
          buildFilters();
          renderMovies();
          openDashboard();
          toast("Movie saved successfully", "success");
        };

        el("clearFormBtn").onclick = () => {
          state.editMovieId = null;
          openDashboard();
        };

        el("dashboardPanel").querySelectorAll("[data-admin]").forEach((btn) => {
          btn.onclick = () => {
            const action = btn.dataset.admin;
            const id = btn.dataset.id;
            if (action === "edit") {
              state.editMovieId = id;
              openDashboard();
              return;
            }
            if (action === "delete") {
              state.movies = state.movies.filter((m) => m.id !== id);
              if (state.editMovieId === id) state.editMovieId = null;
              saveMovies();
              buildFilters();
              renderMovies();
              openDashboard();
              toast("Movie deleted", "success");
            }
          };
        });
      }

      function wireEvents() {
        el("adminBtn").addEventListener("click", () => {
          if (state.isAdmin) openDashboard();
          else openLogin();
        });

        el("searchInput").addEventListener("input", renderMovies);
        el("categoryFilter").addEventListener("change", renderMovies);
        el("yearFilter").addEventListener("change", renderMovies);

        el("moviesGrid").addEventListener("click", (event) => {
          const btn = event.target.closest("[data-action]");
          if (!btn) return;
          const { action, id } = btn.dataset;
          if (action === "watch" || action === "details") openWatch(id);
        });

        ["watchModal", "loginModal", "dashboardModal"].forEach((id) => {
          el(id).addEventListener("click", (event) => {
            if (event.target.id === id) closeModal(id);
          });
        });

        document.body.addEventListener("click", (event) => {
          const closer = event.target.closest("[data-close]");
          if (!closer) return;
          closeModal(closer.dataset.close);
        });
      }

      function init() {
        loadMovies();
        buildFilters();
        wireEvents();
        renderMovies();
      }

      init();
    })();
  </script>
</body>
</html>

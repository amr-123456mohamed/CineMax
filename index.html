<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinema MIX</title>
  <style>
    :root{
      --bg:#07080d;
      --bg-soft:#0f1222;
      --card:#141833;
      --card-2:#1b2050;
      --text:#f2f5ff;
      --muted:#a8b0d4;
      --primary:#5f7dff;
      --accent:#9d3dff;
      --danger:#ff4b6e;
      --success:#2ed39a;
      --radius:16px;
      --shadow:0 14px 40px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family: Inter, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(1000px 500px at 0% -10%, rgba(95,125,255,.25), transparent 60%),
        radial-gradient(1000px 600px at 100% -10%, rgba(157,61,255,.22), transparent 60%),
        var(--bg);
      min-height:100vh;
    }

    .container{width:min(1200px,95%); margin:auto}

    header{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background:rgba(8,10,18,.82);
      border-bottom:1px solid rgba(255,255,255,.1);
    }

    .nav{display:flex; align-items:center; gap:12px; padding:12px 0; flex-wrap:wrap}
    .brand{
      font-weight:900; letter-spacing:.6px; font-size:1.35rem;
      margin-inline:auto; user-select:none;
    }
    .brand span{color:var(--accent)}

    .admin-top-btn{margin-inline-end:auto}

    .search{flex:1 1 260px; max-width:360px}

    input, textarea, select{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:#121736; color:var(--text); outline:none;
      transition:.25s;
    }
    textarea{min-height:90px; resize:vertical}
    input:focus, textarea:focus, select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(95,125,255,.25)}

    .btn{
      border:0; color:#fff; cursor:pointer; border-radius:12px;
      padding:10px 14px; font-weight:700;
      background:linear-gradient(130deg,var(--primary),var(--accent));
      transition:.2s transform,.2s opacity,.2s box-shadow;
      box-shadow:var(--shadow);
    }
    .btn:hover{transform:translateY(-2px)}
    .btn:active{transform:translateY(0)}
    .btn.secondary{background:#20284f; box-shadow:none; border:1px solid rgba(255,255,255,.15)}
    .btn.danger{background:var(--danger)}

    .hero{
      margin-top:16px; border-radius:22px; overflow:hidden; min-height:280px;
      box-shadow:var(--shadow);
      background:linear-gradient(120deg,#1a1f45,#26184f);
      padding:28px;
      display:grid; align-content:end;
      position:relative;
    }
    .hero::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(to top, rgba(6,7,12,.8), rgba(8,10,17,.2));
      pointer-events:none;
    }
    .hero-content{position:relative; z-index:1}
    .hero h1{margin:.2rem 0 .6rem; font-size:clamp(1.5rem,4vw,2.4rem)}
    .hero p{margin:0; color:#d9def8; max-width:760px}

    h2.section-title{margin:28px 0 12px; font-size:1.2rem}

    .movies-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:14px;
      margin-bottom:28px;
    }

    .movie-card{
      background:linear-gradient(160deg,var(--card),var(--card-2));
      border:1px solid rgba(255,255,255,.1);
      border-radius:var(--radius);
      overflow:hidden;
      transition:.28s;
      display:flex; flex-direction:column;
    }
    .movie-card:hover{transform:translateY(-6px); border-color:rgba(157,61,255,.6)}
    .movie-card img{width:100%; height:290px; object-fit:cover; background:#0f1428}
    .movie-body{padding:10px}
    .movie-title{margin:0 0 7px; font-size:1rem; min-height:42px}
    .meta{display:flex; justify-content:space-between; font-size:.84rem; color:var(--muted); margin-bottom:8px}
    .category-chip{display:inline-block; padding:4px 8px; border-radius:999px; font-size:.74rem; margin-bottom:10px; border:1px solid rgba(95,125,255,.5); background:rgba(95,125,255,.2)}

    .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

    .modal{
      position:fixed; inset:0; z-index:100;
      display:none; align-items:center; justify-content:center;
      padding:14px; background:rgba(3,5,10,.78);
    }
    .modal.open{display:flex}
    .panel{
      width:min(980px,100%); max-height:92vh; overflow:auto;
      border:1px solid rgba(255,255,255,.16);
      background:#111737; border-radius:18px; box-shadow:var(--shadow);
      padding:14px;
      animation:show .22s ease;
    }
    @keyframes show{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:scale(1)}}

    .details-grid{display:grid; grid-template-columns:260px 1fr; gap:14px}
    .details-grid img{width:100%; border-radius:14px; height:370px; object-fit:cover}

    .admin-form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px}
    table{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:10px}
    th,td{padding:8px; border-bottom:1px solid rgba(255,255,255,.12); text-align:left}

    .toast-wrap{position:fixed; bottom:15px; right:15px; z-index:160; display:grid; gap:8px}
    .toast{padding:10px 12px; border-radius:12px; background:#1b2250; border:1px solid rgba(255,255,255,.2)}

    .empty{padding:18px; border:1px dashed rgba(255,255,255,.2); border-radius:12px; text-align:center; color:var(--muted); background:rgba(255,255,255,.03)}

    @media (max-width:780px){
      .details-grid{grid-template-columns:1fr}
      .movie-card img{height:250px}
      .brand{order:2; width:100%; text-align:center}
      .search{max-width:none}
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <!-- Admin entry button requested on top-left -->
      <button class="btn secondary admin-top-btn" id="adminEntryBtn">Admin</button>
      <div class="brand">Cinema <span>MIX</span></div>
      <input class="search" id="searchInput" placeholder="Search movies..." />
      <select id="categoryFilter" style="min-width:145px"></select>
      <select id="yearFilter" style="min-width:120px"></select>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to Cinema MIX</h1>
        <p>Discover and watch movies in a modern cinematic experience. Browse, search, and play instantly.</p>
      </div>
    </section>

    <h2 class="section-title">All Movies</h2>
    <section id="moviesGrid" class="movies-grid"></section>
  </main>

  <!-- Details and Watch Modal -->
  <div class="modal" id="watchModal"><div class="panel" id="watchPanel"></div></div>
  <!-- Admin Login Modal -->
  <div class="modal" id="adminLoginModal"><div class="panel" id="adminLoginPanel"></div></div>
  <!-- Admin Dashboard Modal -->
  <div class="modal" id="adminDashboardModal"><div class="panel" id="adminDashboardPanel"></div></div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    (() => {
      "use strict";

      // ---------------------------
      // App constants and storage keys
      // ---------------------------
      const STORAGE_MOVIES = "cinemamix_movies_v2";
      const STORAGE_ADMIN = "cinemamix_admin_loggedin";
      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "Amr20201";

      // Seed data for first run.
      const seedMovies = [
        {
          id: crypto.randomUUID(),
          title: "Dune: Part Two",
          poster: "https://image.tmdb.org/t/p/w780/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
          description: "Paul Atreides joins the Fremen and rises against those who destroyed his family.",
          category: "Action",
          year: 2024,
          rating: 8.8
        },
        {
          id: crypto.randomUUID(),
          title: "Interstellar",
          poster: "https://image.tmdb.org/t/p/w780/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
          description: "A team travels through a wormhole in search of a new home for humanity.",
          category: "Sci-Fi",
          year: 2014,
          rating: 8.6
        },
        {
          id: crypto.randomUUID(),
          title: "The Batman",
          poster: "https://image.tmdb.org/t/p/w780/74xTEgt7R36Fpooo50r9T25onhq.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
          description: "Batman uncovers corruption in Gotham while hunting the Riddler.",
          category: "Drama",
          year: 2022,
          rating: 7.8
        },
        {
          id: crypto.randomUUID(),
          title: "Free Guy",
          poster: "https://image.tmdb.org/t/p/w780/xmbU4JTUm8rsdtn7Y3Fcm30GpeT.jpg",
          video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
          description: "A bank teller discovers he is actually an NPC in a video game.",
          category: "Comedy",
          year: 2021,
          rating: 7.1
        }
      ];

      const state = {
        movies: [],
        editMovieId: null,
        isAdmin: localStorage.getItem(STORAGE_ADMIN) === "1"
      };

      const $ = (id) => document.getElementById(id);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

      function toast(message, type = "info") {
        const node = document.createElement("div");
        node.className = "toast";
        if (type === "error") node.style.borderColor = "rgba(255,75,110,.85)";
        if (type === "success") node.style.borderColor = "rgba(46,211,154,.9)";
        node.textContent = message;
        $("toastWrap").appendChild(node);
        setTimeout(() => node.remove(), 2600);
      }

      function saveMovies() {
        localStorage.setItem(STORAGE_MOVIES, JSON.stringify(state.movies));
      }

      function loadMovies() {
        const stored = JSON.parse(localStorage.getItem(STORAGE_MOVIES) || "null");
        state.movies = Array.isArray(stored) && stored.length ? stored : seedMovies;
        saveMovies();
      }

      function openModal(id) { $(id).classList.add("open"); }
      function closeModal(id) { $(id).classList.remove("open"); }

      function buildFilters() {
        const categories = [...new Set(state.movies.map((m) => m.category))].sort();
        const years = [...new Set(state.movies.map((m) => m.year))].sort((a,b) => b - a);
        $("categoryFilter").innerHTML = `<option value="all">All Categories</option>${categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}`;
        $("yearFilter").innerHTML = `<option value="all">All Years</option>${years.map((y) => `<option value="${y}">${y}</option>`).join("")}`;
      }

      function getFilteredMovies() {
        const q = $("searchInput").value.trim().toLowerCase();
        const category = $("categoryFilter").value;
        const year = $("yearFilter").value;

        return state.movies.filter((m) => {
          const byText = m.title.toLowerCase().includes(q);
          const byCategory = category === "all" || m.category === category;
          const byYear = year === "all" || String(m.year) === year;
          return byText && byCategory && byYear;
        });
      }

      function movieCard(movie) {
        return `
          <article class="movie-card">
            <img loading="lazy" src="${esc(movie.poster)}" alt="${esc(movie.title)} poster" onerror="this.src='https://via.placeholder.com/500x750/121212/ffffff?text=No+Image'" />
            <div class="movie-body">
              <h3 class="movie-title">${esc(movie.title)}</h3>
              <div class="meta"><span>${esc(movie.category)}</span><span>${movie.year}</span></div>
              <div class="meta"><span>⭐ ${Number(movie.rating).toFixed(1)}</span><span></span></div>
              <span class="category-chip">${esc(movie.category)}</span>
              <div class="row">
                <button class="btn" data-action="watch" data-id="${movie.id}">Watch</button>
                <button class="btn secondary" data-action="details" data-id="${movie.id}">Details</button>
              </div>
            </div>
          </article>`;
      }

      function renderMovies() {
        const list = getFilteredMovies();
        $("moviesGrid").innerHTML = list.length ? list.map(movieCard).join("") : `<div class="empty">No movies found.</div>`;
      }

      function openWatchModal(movieId) {
        const movie = state.movies.find((m) => m.id === movieId);
        if (!movie) return;

        $("watchPanel").innerHTML = `
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">${esc(movie.title)}</h2>
            <button class="btn secondary" data-close="watchModal">Close</button>
          </div>
          <div class="details-grid" style="margin-top:8px">
            <img src="${esc(movie.poster)}" alt="${esc(movie.title)}" />
            <div>
              <p style="color:var(--muted)">${esc(movie.description)}</p>
              <div class="row" style="margin-bottom:10px">
                <span class="category-chip">${esc(movie.category)}</span>
                <span>${movie.year}</span>
                <span>⭐ ${Number(movie.rating).toFixed(1)}</span>
              </div>
              <video id="videoPlayer" controls style="width:100%;max-height:380px;background:#000;border-radius:12px">
                <source src="${esc(movie.video)}" type="video/mp4" />
              </video>
            </div>
          </div>`;

        openModal("watchModal");
      }

      function openAdminLoginModal() {
        $("adminLoginPanel").innerHTML = `
          <h2 style="margin-top:0">Admin Login</h2>
          <div class="admin-form-grid">
            <input id="adminUserInput" placeholder="Username" autocomplete="username" />
            <input id="adminPassInput" type="password" placeholder="Password" autocomplete="current-password" />
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="adminLoginBtn">Login</button>
            <button class="btn secondary" data-close="adminLoginModal">Cancel</button>
          </div>`;

        openModal("adminLoginModal");

        $("adminLoginBtn").onclick = () => {
          const user = $("adminUserInput").value.trim();
          const pass = $("adminPassInput").value.trim();

          if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
            state.isAdmin = true;
            localStorage.setItem(STORAGE_ADMIN, "1");
            closeModal("adminLoginModal");
            openAdminDashboard();
            toast("Welcome Admin", "success");
          } else {
            toast("Invalid username or password", "error");
          }
        };
      }

      function openAdminDashboard() {
        if (!state.isAdmin) {
          openAdminLoginModal();
          return;
        }

        const editing = state.movies.find((m) => m.id === state.editMovieId);

        $("adminDashboardPanel").innerHTML = `
          <div class="row" style="justify-content:space-between">
            <h2 style="margin:0">Admin Dashboard</h2>
            <div class="row">
              <button class="btn danger" id="adminLogoutBtn">Logout</button>
              <button class="btn secondary" data-close="adminDashboardModal">Close</button>
            </div>
          </div>

          <h3 style="margin-bottom:8px">Add / Edit Movie</h3>
          <div class="admin-form-grid">
            <input id="fTitle" placeholder="Title" value="${esc(editing?.title || "")}" />
            <input id="fPoster" placeholder="Poster URL" value="${esc(editing?.poster || "")}" />
            <input id="fVideo" placeholder="Video URL" value="${esc(editing?.video || "")}" />
            <input id="fCategory" placeholder="Category" value="${esc(editing?.category || "")}" />
            <input id="fYear" type="number" min="1900" max="2100" placeholder="Year" value="${esc(editing?.year || "")}" />
            <input id="fRating" type="number" min="0" max="10" step="0.1" placeholder="Rating" value="${esc(editing?.rating || "")}" />
          </div>
          <textarea id="fDescription" placeholder="Description">${esc(editing?.description || "")}</textarea>
          <div class="row" style="margin-top:8px">
            <button class="btn" id="saveMovieBtn">Save Movie</button>
            <button class="btn secondary" id="clearEditBtn">Clear</button>
          </div>

          <h3 style="margin:14px 0 8px">Manage Movies</h3>
          <table>
            <thead><tr><th>Title</th><th>Category</th><th>Year</th><th>Rating</th><th>Actions</th></tr></thead>
            <tbody>
              ${state.movies.map((m) => `
                <tr>
                  <td>${esc(m.title)}</td>
                  <td>${esc(m.category)}</td>
                  <td>${m.year}</td>
                  <td>${Number(m.rating).toFixed(1)}</td>
                  <td>
                    <button class="btn secondary" data-admin-action="edit" data-id="${m.id}">Edit</button>
                    <button class="btn danger" data-admin-action="delete" data-id="${m.id}">Delete</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;

        openModal("adminDashboardModal");

        $("adminLogoutBtn").onclick = () => {
          state.isAdmin = false;
          state.editMovieId = null;
          localStorage.removeItem(STORAGE_ADMIN);
          closeModal("adminDashboardModal");
          toast("Logged out", "success");
        };

        $("saveMovieBtn").onclick = () => {
          const payload = {
            id: state.editMovieId || crypto.randomUUID(),
            title: $("fTitle").value.trim(),
            poster: $("fPoster").value.trim(),
            video: $("fVideo").value.trim(),
            description: $("fDescription").value.trim(),
            category: $("fCategory").value.trim(),
            year: Number($("fYear").value),
            rating: Number($("fRating").value)
          };

          // Basic validation and error handling.
          if (!payload.title || !payload.poster || !payload.video || !payload.description || !payload.category || !payload.year || Number.isNaN(payload.rating)) {
            toast("Please complete all movie fields correctly", "error");
            return;
          }

          const idx = state.movies.findIndex((m) => m.id === payload.id);
          if (idx >= 0) state.movies[idx] = payload;
          else state.movies.unshift(payload);

          state.editMovieId = null;
          saveMovies();
          buildFilters();
          renderMovies();
          openAdminDashboard();
          toast("Movie saved successfully", "success");
        };

        $("clearEditBtn").onclick = () => {
          state.editMovieId = null;
          openAdminDashboard();
        };

        $("adminDashboardPanel").querySelectorAll("[data-admin-action]").forEach((btn) => {
          btn.onclick = () => {
            const action = btn.dataset.adminAction;
            const id = btn.dataset.id;

            if (action === "edit") {
              state.editMovieId = id;
              openAdminDashboard();
              return;
            }

            if (action === "delete") {
              state.movies = state.movies.filter((m) => m.id !== id);
              if (state.editMovieId === id) state.editMovieId = null;
              saveMovies();
              buildFilters();
              renderMovies();
              openAdminDashboard();
              toast("Movie deleted", "success");
            }
          };
        });
      }

      function wireEvents() {
        $("searchInput").addEventListener("input", renderMovies);
        $("categoryFilter").addEventListener("change", renderMovies);
        $("yearFilter").addEventListener("change", renderMovies);

        $("adminEntryBtn").addEventListener("click", () => {
          if (state.isAdmin) openAdminDashboard();
          else openAdminLoginModal();
        });

        $("moviesGrid").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const { action, id } = btn.dataset;
          if (action === "watch" || action === "details") openWatchModal(id);
        });

        // close modal by clicking backdrop
        ["watchModal", "adminLoginModal", "adminDashboardModal"].forEach((id) => {
          $(id).addEventListener("click", (e) => {
            if (e.target.id === id) closeModal(id);
          });
        });

        // close modal by [data-close] buttons (event delegation)
        document.body.addEventListener("click", (e) => {
          const closeBtn = e.target.closest("[data-close]");
          if (!closeBtn) return;
          closeModal(closeBtn.dataset.close);
        });
      }

      function init() {
        loadMovies();
        buildFilters();
        wireEvents();
        renderMovies();
      }

      init();
    })();
  </script>
</body>
</html>
